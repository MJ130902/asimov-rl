repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml uses python tags (!!python/name:...) that safe_load rejects.
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
        # Meshes and large binaries go through Git LFS.
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      # Formats code in place. Settings are in src/pyproject.toml.
      - id: black
        args: [--config=src/pyproject.toml]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        # Settings (line length, complexity, black compatibility) are in .flake8.
        # E, W = pycodestyle, F = pyflakes, C90 = McCabe complexity
        # flake8-bugbear (B) = likely bugs, flake8-simplify (SIM) = simplifications
        # flake8-cognitive-complexity (CCR) = cognitive complexity
        additional_dependencies:
          - flake8-bugbear
          - flake8-simplify
          - flake8-cognitive-complexity

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Settings are in src/pyproject.toml. Dependencies (jax, mujoco, ...)
        # are not installed in the hook environment, so skip their stubs.
        args: [--config-file=src/pyproject.toml, --ignore-missing-imports]
        files: ^(src|sim)/.*\.py$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        # Security linter: eval, pickle, hardcoded secrets, shell calls.
        args: [--quiet]

  # Planned: pytest hook. Add it in the same change that adds the first test
  # and a working `src/pyproject.toml`. Both are empty today.

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.20.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"
          - "commitlint-config-gitmoji"

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
